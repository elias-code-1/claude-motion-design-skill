# Rendu automatique de la vidéo dans le cloud (GitHub Actions).
# Déclenchement : à chaque envoi (push) sur la branche principale, ou à la main
# (onglet Actions -> « Render video » -> « Run workflow »).
# Résultat : le MP4 est dans la section « Artifacts » de l'exécution (artefact « video »).
name: Render video

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      vertical:
        description: 'Rendre aussi la version verticale 9:16 (Reels, TikTok, Shorts)'
        type: boolean
        default: false

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render video
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Générer la musique et les SFX (seulement s'ils manquent)
        if: ${{ hashFiles('public/audio/sfx/**') == '' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python3 -m pip install numpy scipy || python3 -m pip install --break-system-packages numpy scipy
          npm run sfx

      - name: Rendre la vidéo 16:9
        run: npm run render

      - name: Rendre la version verticale 9:16
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.vertical }}
        run: npm run render:vertical

      - name: Publier la vidéo
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 14
